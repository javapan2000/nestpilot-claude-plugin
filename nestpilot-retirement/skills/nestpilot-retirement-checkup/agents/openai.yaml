interface:
  display_name: "NestPilot Retirement Checkup"
  short_description: "Coordinate a complete educational retirement checkup"
  default_prompt: "Use $nestpilot-retirement-checkup to assess whether I can retire. Collect the missing core facts, open the persistent Retirement Checkup review, and let every calculation run only after I click its button."

dependencies:
  tools:
    - type: "mcp"
      value: "nestpilot"
      description: "Anonymous NestPilot retirement calculation tools"
      transport: "streamable_http"
      url: "https://mcp.nestpilot.net/mcp"

policy:
  allow_implicit_invocation: true
